name: Helm chart release

on:
  workflow_dispatch:
  push:
    tags:
      - chart-v*

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/chart-v')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Check chart version matches tag
        if: github.event_name == 'push'
        run: |
          chart_version=$(helm show chart deploy/helm/cnpg-drill | sed -n 's/^version: //p')
          test "${GITHUB_REF_NAME}" = "chart-v${chart_version}"
      - name: Lint and package
        run: |
          helm lint deploy/helm/cnpg-drill --set cluster=example
          helm package deploy/helm/cnpg-drill --destination dist
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Log in for OCI attestations
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish OCI chart
        id: chart
        env:
          CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts/cnpg-drill
        run: |
          set -euo pipefail
          helm push dist/cnpg-drill-*.tgz "oci://${CHART_REPOSITORY%/cnpg-drill}" 2>&1 | tee chart-push.log
          digest=$(sed -n 's/^Digest: //p' chart-push.log)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest chart OCI manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/cnpg-drill
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest chart archive
        id: archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/cnpg-drill-*.tgz
          create-storage-record: false
      - name: Preserve chart archive and attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-chart-with-provenance
          path: |
            dist/cnpg-drill-*.tgz
            ${{ steps.archive.outputs.bundle-path }}
          if-no-files-found: error
