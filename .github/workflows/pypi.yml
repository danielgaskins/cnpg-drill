name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == f"v{version}", f"{tag} does not match package version {version}"
          assert subprocess.check_output(
              ["git", "tag", "--points-at", "HEAD"], text=True
          ).splitlines().count(tag) == 1, f"{tag} is not at HEAD"
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
