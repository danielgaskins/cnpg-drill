apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnpg-drill-rustfs
  template:
    metadata:
      labels:
        app: cnpg-drill-rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-creds
                  key: secretKey
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  type: ClusterIP
  selector:
    app: cnpg-drill-rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: drill-store
spec:
  configuration:
    destinationPath: s3://cnpg-drill/
    endpointURL: http://rustfs:9000
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: accessKey
      secretAccessKey:
        name: s3-creds
        key: secretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
spec:
  instances: 1
  storage:
    size: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: drill-store
