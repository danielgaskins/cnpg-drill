apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cnpg-drill.name" . }}
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspended }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ add .Values.timeoutSeconds 180 }}
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "cnpg-drill.name" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["run", "--config", "/etc/cnpg-drill/drill.json"]
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /etc/cnpg-drill
                  readOnly: true
                - name: temp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: {{ include "cnpg-drill.name" . }}
            - name: temp
              emptyDir: {}
