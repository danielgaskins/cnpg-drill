{{- if not .Values.cluster }}
{{- fail "cluster must be set to the source CloudNativePG Cluster name" }}
{{- end }}
{{- if not .Values.image.repository }}
{{- fail "image.repository must be set to a published cnpg-drill image" }}
{{- end }}
{{- if and .Values.reports.enabled (not .Values.reports.existingClaim) (not .Values.reports.size) }}
{{- fail "reports.size must be set when creating a report PVC" }}
{{- end }}
{{- if and .Values.alerts.enabled (le (int .Values.alerts.maxSecondsSinceSuccess) 0) }}
{{- fail "alerts.maxSecondsSinceSuccess must be positive" }}
{{- end }}
